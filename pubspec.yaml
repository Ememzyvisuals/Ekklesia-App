name: ekklesia
description: "Ekklesia — streaming, Bible study, and AI-assisted discipleship for DCLM and Christians everywhere."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  # riverpod_annotation removed — nothing in this codebase uses @riverpod
  # code generation; every provider is a plain Provider/StateProvider/
  # FutureProvider.

  # Navigation
  go_router: ^14.2.0

  # Firebase/Firestore removed entirely — the app is offline-first now.
  # firebase_core, cloud_firestore, and cloud_functions are gone; every
  # feature that used to live there is Drift- or asset-backed (see
  # PROJECT_MIGRATION_AUDIT.md and OFFLINE_ENGINE.md). Groq and YouTube
  # sync still go through the Cloudflare Workers in cloudflare/
  # groq-proxy/ and cloudflare/youtube-sync/ — those were never
  # Firebase, so they're unaffected by this removal.
  # Local notifications only, no FCM.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4 # zonedSchedule requires this for scheduled local notifications

  # Local storage
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2 # Groq user key — see user_groq_key_service.dart migration note
  uuid: ^4.4.0 # LocalProfile id generation — see profile_repository.dart

  # isar_community / isar_community_flutter_libs REMOVED (previously used
  # ONLY for BibleAudioCacheEntity, TTS cache metadata) — see main.dart's
  # and cleanup_worker.dart's history for why. Removed as part of the
  # decision to drop TTS entirely (see below) in favor of pre-recorded
  # audio Bible downloads instead. Everything else was already fully
  # migrated to Drift, so this genuinely was the last remaining reason
  # Isar existed in this app at all.

  shared_preferences: ^2.2.3

  # sherpa_onnx / flutter_tts REMOVED — TTS has been dropped from this
  # app entirely, in favor of downloading pre-recorded audio Bible
  # content instead (see audio_bible/ at the repo root for the
  # packaging pipeline). This was a deliberate product decision, not a
  # bug fix: after nine straight rounds of real, confirmed, individually
  # fixed root causes across both engines (missing sherpa-onnx
  # bindings init, missing flutter_tts completion-callback opt-ins,
  # a missing Android 11+ manifest <queries> element, and finally a
  # synthesizeToFile()-specific reliability gap requiring a speak()
  # fallback) still left generation hanging or failing unpredictably on
  # real devices, pre-recorded, professionally-produced audio is both
  # more reliable and higher quality than on-device synthesis ever was
  # going to be for this app's actual use case (reading Scripture aloud
  # — not, e.g., a live conversational assistant, where synthesis is
  # unavoidable).

  # Media
  just_audio: ^0.9.40
  # just_audio_background removed — see main.dart and radio_service.dart
  # for why. Six straight rounds of a device-confirmed
  # `LateInitializationError: Field '_audioHandler@...' has not been
  # initialized` across every audio feature in the app (Radio, TTS
  # generation, TTS playback — not just the MediaItem-tagged player),
  # even after three independently-researched, docs-confirmed,
  # in-session-executed manifest fixes, is what finally made clear this
  # wasn't a misconfiguration to keep chasing — the failure signature
  # (identical, permanent, spanning every audio path in the app, not
  # just the one that explicitly opts into background/MediaItem
  # features) means calling JustAudioBackground.init() anywhere in the
  # app silently takes over every AudioPlayer's platform implementation
  # app-wide, whether that specific player asked for it or not. Removing
  # the dependency entirely — rather than trying to configure it
  # correctly a fourth time — eliminates the whole failure class. Real
  # cost: no lock-screen/notification playback controls for Radio.
  # Real benefit: plain `just_audio` alone needs no special native
  # Android setup at all, and every audio feature in this app was
  # broken without it working, so reliability wins here.
  youtube_player_flutter: ^9.0.3

  # Networking
  http: ^1.2.2
  dio: ^5.5.0+1

  # Utilities
  flutter_svg: ^2.0.10+1 # renders assets/avatars/*.svg (default illustrated avatars)
  url_launcher: ^6.3.1 # Games: external launch path for entries without embed permission
  webview_flutter: ^4.10.0 # Games: in-app embed + local-import play path
  file_picker: ^8.1.2 # Games: lets the user pick a packaged .zip game file to import
  archive: ^3.6.1 # Games: extracts an imported .zip game bundle to local storage
  cached_network_image: ^3.4.1 # video/game thumbnails
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4
  # Deliberately unpinned — flutter_localizations (Flutter SDK) requires
  # an exact intl version that changes with each Flutter release
  # (currently 0.20.2). Pinning this to a caret range (e.g. ^0.19.0)
  # creates a version-solving conflict the moment the SDK's requirement
  # moves past that range — exactly what broke CI here. `intl: any` lets
  # pub resolve to whatever the SDK actually ships. Only basic
  # DateFormat(...) calls in this codebase (bookmarks_screen.dart,
  # notifications_screen.dart, video_player_screen.dart) — stable across
  # 0.19->0.20, so this is safe.
  intl: any
  # freezed_annotation/json_annotation removed — nothing in this codebase
  # uses @freezed or @JsonSerializable; every model is a hand-written
  # class (Drift generates its own row classes; the rest are plain Dart).
  # flutter_dotenv removed — see main.dart's note on why .env is gone
  # entirely, not just its content emptied.
  # connectivity_plus removed — its only caller was SyncWorker
  # (PROJECT_MIGRATION_AUDIT.md Phase 4: deleted as dead code, zero real
  # callers of its own queueWrite()). Nothing else in the app needs a
  # connectivity listener.
  crypto: ^3.0.3 # sha256 checksum verification for completed downloads (DownloadWorker)

  sqlite3: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  # riverpod_generator/freezed/json_serializable removed — nothing
  # generates code from @riverpod/@freezed/@JsonSerializable in this
  # codebase (see the runtime-package removal notes above).
  #
  # isar_community_generator REMOVED — it existed only to generate code
  # for BibleAudioCacheEntity (Isar's schema builder), and that whole
  # file is gone now that TTS (its only consumer) has been removed
  # entirely — see the isar_community removal note in dependencies
  # above.
  drift_dev: ^2.20.3
  # App icon + splash screen generation. Both only ever run inside
  # release.yml, right after that workflow's `flutter create .` step —
  # this repo deliberately doesn't commit android/ios/ (see release.yml's
  # comments), and both these tools write into native project folders
  # that only exist ephemerally on the CI runner. Nothing to run from
  # Termux; there's no native scaffolding on disk to write into locally.
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/ekklesia_logo_icon_source.png"
  min_sdk_android: 21
  # No adaptive_icon_foreground/background here on purpose: the supplied
  # logo (assets/branding/ekklesia_logo_icon_source.png) is a flattened
  # illustration with its own rounded-square green backdrop already
  # baked into the raster, not a separate transparent-background glyph
  # a background color could sit behind. Extracting a clean foreground-
  # only cutout from a flattened image risks visible artifacts around
  # the edges — using image_path alone reproduces the supplied logo
  # exactly as given (per "do not invent another logo") at the cost of
  # Android 12+'s adaptive-icon shape masking/parallax effect, which is
  # the right trade here: faithful over fancy.

flutter_native_splash:
  color: "#1F5E3B"
  image: "assets/branding/ekklesia_logo.png"
  android_12:
    color: "#1F5E3B"
    image: "assets/branding/ekklesia_logo.png"

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/avatars/
    - assets/characters/
    - assets/branding/ekklesia_logo.png
    - assets/data/games.json
    - assets/data/programs.json
    - assets/data/messages.json
    - assets/bible/manifest.json
    - assets/bible/en.json
    - assets/bible/yo.json
    - assets/bible/ha.json
    - assets/bible/ig.json
    - assets/bible/pcm.json
