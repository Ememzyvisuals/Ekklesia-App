name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    # Secrets can't be referenced directly in an `if:` conditional (job or
    # step level) — GitHub's parser rejects the whole workflow file with
    # "Unrecognized named-value: 'secrets'" if you try, which is a
    # parse-time failure, not a runtime one (the job never even starts).
    # Documented: https://docs.github.com/actions/security-guides/using-secrets-in-github-actions
    # Fix is exactly what those docs recommend — promote the check to a
    # job-level env var (secrets ARE allowed in job-level env:), then
    # reference the env var in each step's `if:` instead.
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # flutter_inappwebview_android (pulled in transitively by
      # youtube_player_flutter — not a direct dependency of this app) has
      # ^1.1.3's Android build.gradle calling
      # getDefaultProguardFile('proguard-android.txt'), which R8 in
      # current Android Gradle Plugin versions rejects outright ("no
      # longer supported... includes -dontoptimize"). Nothing in this
      # app's own code triggers this — it's the plugin's own bundled
      # build.gradle failing to evaluate before this project's code is
      # even touched. Patch it directly in the pub cache, the same
      # "surgical hex-edit of a third-party file we don't own" approach
      # as the Google Services Gradle-plugin patch used to be — except
      # this one's actually necessary, not dead weight.
      - name: Patch flutter_inappwebview_android proguard incompatibility
        run: |
          for f in "$PUB_CACHE"/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle; do
            if [ -f "$f" ] && grep -q "proguard-android.txt" "$f"; then
              sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$f"
              echo "Patched $f"
            fi
          done

      - name: Generate Drift + Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localization code
        run: flutter gen-l10n

      # This is what actually closes the "no android/ directory" gap —
      # `flutter create .` only fills in missing platform folders, it
      # does not touch lib/ or any existing config, so it's safe to run
      # against an existing project. This is fundamentally different from
      # hand-writing android/ios by hand (which this project's docs
      # explicitly decided against — see FINAL_AUDIT_REPORT.md): this
      # step runs on a real GitHub Actions runner with a real Flutter SDK
      # (installed by subosito/flutter-action above), so the generated
      # project is guaranteed correct for whatever Flutter version the
      # runner has — not a hand-guessed, untestable copy.
      - name: Generate platform folders
        run: flutter create . --platforms=android,ios --org com.ememzyvisuals --project-name ekklesia

      # Evidence-driven, not speculative: a real device's Network
      # Diagnostics screen (network_diagnostics.dart) showed EVERY
      # single endpoint — including google.com itself — failing DNS
      # resolution in under 40ms with "No address associated with
      # hostname." That specific signature (instant, uniform failure
      # across every hostname, far faster than any real DNS timeout)
      # is the standard fingerprint of a missing INTERNET permission:
      # Android denies the socket() call outright before any actual
      # network I/O is attempted. `flutter create`'s default template
      # does include this permission — confirmed via flutter/flutter's
      # own issue tracker — but this guarantees it regardless of
      # anything upstream (the template, or any later step) that could
      # have dropped it, the same "verify and patch a freshly generated
      # file" pattern already used for signing/desugaring/compileSdk
      # elsewhere in this workflow.
      - name: Ensure INTERNET permission is present
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "INTERNET permission already present in $manifest."
          else
            echo "INTERNET permission missing. Adding it now."
            python3 - <<'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          permission_line = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          content = content.replace("<application", permission_line + "\n    <application", 1)
          with open(path, "w") as f:
              f.write(content)
          PYEOF
            if grep -q 'android.permission.INTERNET' "$manifest"; then
              echo "INTERNET permission added successfully."
            else
              echo "::error::Failed to add INTERNET permission. Manifest structure may have changed."
              exit 1
            fi
          fi

      # Real, confirmed root cause of TTS silently hanging forever on
      # both the Bible screen and AI Assistant "Listen" — never a Dart-
      # level bug at all. Per Android's own developer documentation
      # (developer.android.com/about/versions/11/behavior-changes-11):
      # apps targeting Android 11+ that use text-to-speech MUST declare
      # this exact <queries> element, or Android's package-visibility
      # restrictions prevent the app from even seeing an installed TTS
      # engine — TextToSpeech initialization then silently never
      # completes, no error, no timeout of its own, just permanently
      # stuck. This has nothing to do with flutter_tts's Dart API
      # (awaitSynthCompletion, isFullPath, etc. — all still correct and
      # necessary, just not sufficient on their own) and everything to
      # do with the manifest `flutter create .` generates having no way
      # to know this app uses TTS at all. Same "verify and patch a
      # freshly generated file" pattern as the INTERNET permission step
      # above.
      - name: Ensure TTS package-visibility queries element is present
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          if grep -q 'android.intent.action.TTS_SERVICE' "$manifest"; then
            echo "TTS queries element already present in $manifest."
          else
            echo "TTS queries element missing. Adding it now."
            python3 - <<'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          queries_block = (
              '    <queries>\n'
              '        <intent>\n'
              '            <action android:name="android.intent.action.TTS_SERVICE" />\n'
              '        </intent>\n'
              '    </queries>\n'
          )
          content = content.replace("<application", queries_block + "\n    <application", 1)
          with open(path, "w") as f:
              f.write(content)
          PYEOF
            if grep -q 'android.intent.action.TTS_SERVICE' "$manifest"; then
              echo "TTS queries element added successfully."
            else
              echo "::error::Failed to add TTS queries element. Manifest structure may have changed."
              exit 1
            fi
          fi

      # flutter_plugin_android_lifecycle (transitive, via file_picker —
      # and possibly others) now requires compileSdk 36+; `flutter create`
      # on this Flutter version still defaults lower, so
      # :file_picker:checkReleaseAarMetadata fails before this app's own
      # code is touched. Reopening `android {}` a second time and
      # reassigning compileSdk is last-write-wins in both Gradle DSLs, so
      # this simple override is enough — no need to touch targetSdk or
      # minSdk, which affect runtime behavior and aren't what's broken
      # here.
      - name: Bump compileSdk for plugins requiring API 36+
        run: |
          path="android/app/build.gradle"
          [ -f "$path" ] || path="android/app/build.gradle.kts"
          # Appending a second `android { compileSdk = 36 }` block after
          # `flutter create`'s own didn't stick — confirmed by testing:
          # the build still reported compiled-against android-34 with
          # that block present in the file. Editing the exact original
          # line in place instead, so there is only ever one statement
          # setting this value, with nothing else in the file that could
          # be evaluated afterward and win.
          sed -i \
            -e 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' \
            -e 's/compileSdk flutter\.compileSdkVersion/compileSdk 36/' \
            -e 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' \
            -e 's/compileSdkVersion = flutter\.compileSdkVersion/compileSdkVersion = 36/' \
            "$path"
          if grep -q "compileSdk.*= *36\|compileSdk 36\|compileSdkVersion 36" "$path"; then
            echo "compileSdk successfully set to 36 in $path"
          else
            echo "::error::None of the expected compileSdk patterns matched in $path — inspect the generated file, flutter create's template may have changed."
            grep -n "compileSdk" "$path" || echo "(no compileSdk line found at all)"
            exit 1
          fi

      # The step above only touches :app. The actual failing subproject
      # (:file_picker, and potentially others as more plugins update)
      # is a SEPARATE Gradle module entirely — Flutter compiles every
      # plugin's own Android code as its own subproject (see
      # https://github.com/flutter/flutter/wiki/How-Flutter-apps-are-
      # compiled-with-Gradle-for-Android), each with its own compileSdk
      # declared inside that plugin's own pub-cache'd build.gradle.
      # Editing :app can never fix a different subproject's own value.
      # There is also a documented Flutter behavior where explicit
      # compileSdk overrides in :app's build.gradle get silently
      # re-forced back down by the Flutter Gradle plugin in some
      # versions (flutter/flutter#174516) — so even :app isn't reliably
      # fixed by editing that file alone.
      #
      # The actual fix, documented widely for this exact error across
      # multiple plugins (file_picker, objectbox, adjust_sdk, and
      # others hitting the same AAR-metadata check): force every
      # subproject's compileSdk from the ROOT build.gradle, in an
      # afterEvaluate block so it runs after each subproject — app or
      # plugin — has already configured itself, guaranteeing this is
      # the final word regardless of what that subproject set on its
      # own.
      - name: Force compileSdk 36 across all subprojects (root build.gradle)
        run: |
          path="android/build.gradle"
          [ -f "$path" ] || path="android/build.gradle.kts"
          # This MUST be prepended, not appended. flutter create's
          # generated root file already has its own
          # `subprojects { project.evaluationDependsOn(":app") }` line,
          # and calling evaluationDependsOn forces :app to evaluate
          # early — right then, mid-script. An afterEvaluate block
          # appended AFTER that line in the file runs too late: :app has
          # already finished evaluating by the time it's reached, and
          # Gradle refuses to register afterEvaluate on an
          # already-evaluated project ("Cannot run
          # Project.afterEvaluate(Action) when the project is already
          # evaluated" — confirmed by testing the appended version).
          # Registering first, before that line even runs, avoids the
          # ordering conflict entirely.
          if [[ "$path" == *.kts ]]; then
            cat "$path" > "$path.orig"
            cat > "$path" <<'EOF'
          import com.android.build.gradle.BaseExtension

          subprojects {
              afterEvaluate {
                  val isAndroid = plugins.hasPlugin("com.android.application") ||
                      plugins.hasPlugin("com.android.library")
                  if (isAndroid) {
                      val androidExt = extensions.findByName("android") as? BaseExtension
                      androidExt?.compileSdkVersion(36)
                  }
              }
          }

          EOF
            cat "$path.orig" >> "$path"
            rm "$path.orig"
          else
            cat "$path" > "$path.orig"
            cat > "$path" <<'EOF'
          subprojects {
              afterEvaluate { proj ->
                  if (proj.hasProperty("android")) {
                      proj.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }

          EOF
            cat "$path.orig" >> "$path"
            rm "$path.orig"
          fi
          echo "Force-set compileSdk 36 for all subprojects via $path"

      # flutter_local_notifications ^18.0.1 uses java.time APIs
      # internally that require Android core library desugaring to be
      # enabled — without this, assembleRelease fails outright at
      # :app:checkReleaseAarMetadata before any of this app's own code
      # is even touched, same category of problem as the
      # flutter_inappwebview patch above: a real, direct dependency's
      # own requirement, not a bug in this project's Dart code, and not
      # something `dart fix`/`flutter analyze` can see since it's a
      # native Android build concern. Reopening `android {}` and
      # `dependencies {}` in the same script is legal in both Gradle
      # DSLs — Gradle merges repeated blocks rather than erroring — so
      # this appends cleanly regardless of what `flutter create`
      # already generated inside those blocks.
      - name: Enable core library desugaring (required by flutter_local_notifications)
        run: |
          path="android/app/build.gradle"
          [ -f "$path" ] || path="android/app/build.gradle.kts"
          if [[ "$path" == *.kts ]]; then
            cat >> "$path" <<'EOF'
          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
          else
            cat >> "$path" <<'EOF'
          android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }
          }
          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          EOF
          fi
          echo "Appended core library desugaring config to $path"

      # Both tools write straight into android/ios/, which only exist on
      # this runner from the step above — nothing to commit back, nothing
      # runnable from Termux (no native folders on disk there). Re-run
      # every release build, from the same source PNGs each time, so the
      # icon/splash config in pubspec.yaml stays the single source of
      # truth rather than drifting from whatever got hand-generated once.
      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      # Wires up real release signing from repository secrets, instead of
      # silently falling back to the debug keystore `flutter create`
      # ships by default (which builds fine but isn't installable-as-an-
      # update over a Play Store release, and Play Console will reject an
      # AAB signed with the debug key anyway). Skips cleanly if the
      # secrets aren't configured yet — the build still succeeds
      # debug-signed, it just isn't store-submittable until secrets exist.
      - name: Configure Android release signing
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF
          # `flutter create`'s generated build.gradle only has a debug
          # signingConfig wired to the release buildType — patch in a
          # real release signingConfig that reads the key.properties
          # above, following the standard Flutter release-signing setup.
          #
          # Flutter now defaults to the Kotlin DSL (build.gradle.kts),
          # not Groovy (build.gradle) — confirmed the hard way: the first
          # version of this patch injected Groovy syntax (`def x = ...`)
          # unconditionally regardless of which file it found, which is
          # not valid Kotlin and failed the whole Gradle script
          # compilation with "Expecting an element". Kotlin needs
          # `val`/`create("release")`/explicit imports where Groovy
          # doesn't, so the two extensions need genuinely different
          # injected text, not just a different file path.
          python3 - <<'PYEOF'
          import re, os
          path = "android/app/build.gradle"
          if not os.path.exists(path) and os.path.exists(path + ".kts"):
              path = path + ".kts"
          is_kts = path.endswith(".kts")
          src = open(path).read()
          if "keystoreProperties" not in src:
              if is_kts:
                  if "java.util.Properties" not in src:
                      src = (
                          "import java.util.Properties\n"
                          "import java.io.FileInputStream\n\n" + src
                      )
                  inject = '''
          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          '''
                  src = src.replace("android {", inject + "\nandroid {", 1)
                  release_signing = '''
              signingConfigs {
                  create("release") {
                      if (keystorePropertiesFile.exists()) {
                          keyAlias = keystoreProperties["keyAlias"] as String
                          keyPassword = keystoreProperties["keyPassword"] as String
                          storeFile = file(keystoreProperties["storeFile"] as String)
                          storePassword = keystoreProperties["storePassword"] as String
                      }
                  }
              }
          '''
                  src = re.sub(r"buildTypes \{", release_signing + "\n    buildTypes {", src, count=1)
                  src = re.sub(
                      r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                      'signingConfig = signingConfigs.getByName("release")',
                      src,
                  )
              else:
                  inject = '''
          def keystorePropertiesFile = rootProject.file("key.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
                  src = src.replace("android {", inject + "\nandroid {", 1)
                  release_signing = '''
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                      }
                  }
              }
          '''
                  src = re.sub(r"buildTypes \{", release_signing + "\n    buildTypes {", src, count=1)
                  src = src.replace(
                      "signingConfig signingConfigs.debug",
                      "signingConfig signingConfigs.release",
                  )
              open(path, "w").write(src)
              print(f"Patched {path} with release signing config.")
          else:
              print(f"{path} already references keystoreProperties — skipping patch.")
          PYEOF

      # PROJECT_MIGRATION_AUDIT.md Phase 3: youtubeApiKey is passed at
      # build time via --dart-define, not read from any file (see
      # AppConfig.youtubeApiKey's doc comment). Without this secret set,
      # the build steps below still succeed — --dart-define with an empty
      # value just means AppConfig falls back to its own placeholder
      # string — but the resulting release build's YouTube/sermon library
      # feature will silently 401/403 against the real API on a real
      # device. Warn loudly here instead of letting that ship unnoticed.
      - name: Check YOUTUBE_API_KEY secret is set
        if: env.HAS_YOUTUBE_API_KEY != 'true'
        run: echo "::warning::YOUTUBE_API_KEY secret is not set — this release build's YouTube/sermon library feature will not work on a real device. Set the secret before tagging a real release."

      - name: Build release APK
        run: flutter build apk --release --dart-define=YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}

      - name: Build App Bundle (for Play Store)
        run: flutter build appbundle --release --dart-define=YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  create-release:
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/flutter-apk/app-release.apk
            dist/bundle/release/app-release.aab
          generate_release_notes: true
          draft: true
