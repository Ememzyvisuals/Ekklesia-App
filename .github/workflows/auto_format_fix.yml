name: Auto-format & Auto-fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate Drift + Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localization code
        run: flutter gen-l10n

      - name: Apply automatic lint fixes
        run: dart fix --apply

      - name: Format all source files
        run: dart format .

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Nothing to commit — dart fix/format made no changes."
          else
            git commit -m "Auto-fix: dart fix --apply && dart format (via Actions, not hand-edited)"
            git push
          fi
