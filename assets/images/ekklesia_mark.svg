<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ekklesia">
  <!-- Ekklesia app icon / mark.
       Concept: an open book (Scripture) with a single tapered gold ray
       rising from the spine — the Word "going out," and the gathering
       (ekklesia = the called-out assembly) it draws people into. One
       accent color, one signature shape; everything else stays quiet
       on purpose so it still reads clearly at 48px launcher size. -->

  <!-- Background: rounded-square app-icon container, Forest Green -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="#1F5E3B"/>

  <!-- Spine shadow: small grounding shape behind the ray -->
  <rect x="246" y="322" width="20" height="30" rx="8" fill="#16452B" opacity="0.55"/>

  <!-- Left page (Stone) -->
  <path
    d="M256,188
       C 195,150 140,148 116,168
       C 96,186 92,250 100,300
       C 106,326 130,338 160,342
       C 190,346 226,346 256,344
       Z"
    fill="#F5F4EF"/>

  <!-- Right page (Stone), mirror of left -->
  <path
    d="M256,188
       C 317,150 372,148 396,168
       C 416,186 420,250 412,300
       C 406,326 382,338 352,342
       C 322,346 286,346 256,344
       Z"
    fill="#F5F4EF"/>

  <!-- Fold shading: quiet depth cue, not a separate illustration -->
  <path
    d="M256,196 C 220,210 172,214 130,206"
    stroke="#E4E1D6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path
    d="M256,196 C 292,210 340,214 382,206"
    stroke="#E4E1D6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Rising ray: the single signature element, Warm Gold -->
  <path
    d="M256,344
       C 252,280 252,180 256,120
       C 260,180 260,280 256,344
       Z"
    fill="#C8A24D"/>
</svg>
